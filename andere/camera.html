<!DOCTYPE html>
<html>
    <head>
        <title>Webcam in vier Quadranten</title>
        <meta charset="UTF-8" />
        <script type="text/javascript" src="https://cindyjs.org/dist/v0.8.43/Cindy.js"></script>
        <script type="text/javascript" src="https://cindyjs.org/dist/v0.8.43/CindyGL.js"></script>
        <link rel="stylesheet" href="https://cindyjs.org/dist/v0.8/CindyJS.css" />
        <script id="csinit" type="text/x-cindyscript">
            drawgrid = true;
            width = 640;
            height = 640/4*3;
            //screen = reverse(apply(screenbounds(), #.xy));
            //println("Screen size: " + screenwidth + " x " + screenheight);
            W = 10; // reference width for imagergb()
            H = 2.4; // reference height for imagergb()

            
            video = cameravideo(resolution -> [640,4/3]);

            createimage("input", width, height);
            createimage("hormirror", width, height);
            createimage("vertmirror", width, height);
            createimage("meanimage", width, height);

            colorplot("hormirror", 0);
            colorplot("vertmirror", 0);
            colorplot("meanimage", 0);

            mirrorhor(p):= if(p_1 < W/2,
                imagergb("input", p),
                imagergb("input", [W-p_1, p_2])
            );

            flipvert(p):= if(p_2 < H/2,
                imagergb("input", p),
                imagergb("input", [p_1, H-p_2])
            );

            meanimage(p):= (mirrorhor(p) + flipvert(p)) / 2;
        </script>
        <script id="csdraw" type="text/x-cindyscript">
            // Draw grid for debugging
            if(drawgrid,
                // origin
                draw([0,0]);

                // grid
                linecolor(.8*(1,1,1));
                repeat(65,start->-3,step->.5,draw((#,-3),(#,6)));
                repeat(25,start->-3,step->.5,draw((-1,#),(14,#)));
            );

            // Update images from video
            if (imageready(video),
                // Create base image
                colorplot("input", imagergb(video, #));
                
                // Create horizontally mirrored image
                //colorplot("hormirror", imagergb(video, #  [10,0]));
                colorplot("hormirror", mirrorhor(#));

                // Create vertically mirrored image
                colorplot("vertmirror", flipvert(#));

                // Create mean image
                colorplot("meanimage", meanimage(#));
            );

            // Draw images
            drawimage(O0, O1, "input");
            drawimage(H0, H1, "hormirror");
            drawimage(V0, V1, "vertmirror");
            drawimage(M0, M1, "meanimage");
        </script>
        <script type="text/javascript">
            var cdy = CindyJS({
                ports: [{ id: "CSCanvas", transform: [{ visibleRect: [0, 0, 10, 2.4] }] }],
                scripts: "cs*",
                language: "en",
                defaultAppearance: {},
                geometry: [
                    { name: "O0", type: "Free", pos: [.5, 2], visible: false },
                    { name: "O1", type: "Free", pos: [4, 2], visible: false },
                    { name: "H0", type: "Free", pos: [.5, -1.5], visible: false },
                    { name: "H1", type: "Free", pos: [4, -1.5], visible: false },
                    { name: "V0", type: "Free", pos: [5, -1.5], visible: false },
                    { name: "V1", type: "Free", pos: [8.5, -1.5], visible: false },
                    { name: "M0", type: "Free", pos: [5, 2], visible: false },
                    { name: "M1", type: "Free", pos: [8.5, 2], visible: false },
                ],
                use: ["CindyGL", "katex"],
            });
        </script>
    </head>

    <body style="font-family: Arial, serif">
        <h1>Webcam in vier Quadranten</h1>
        <div id="CSCanvas" style="width: 640px; height: 480px; border: 0; margin: 0; border: 3px solid black;"></div>
        <p>
            Oben links: originaler Video Feed<br>
            Unten links: horizontale Spiegelung<br>
            Unten rechts: vertikale Spiegelung<br>
            Oben rechts: Mittelwert aus beiden Spiegelbildern
        </p>
    </body>
</html>
